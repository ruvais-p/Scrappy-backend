components:
  schemas:
    DashboardResponse:
      type: object
      properties:
        identity:
          type: object
          additionalProperties: {}
        date:
          type: string
          format: date
        pickup_chart:
          type: object
          additionalProperties: {}
        metrics:
          type: array
          items:
            type: object
            additionalProperties: {}
        bills:
          type: array
          items:
            type: object
            additionalProperties: {}
        leads:
          type: array
          items:
            type: object
            additionalProperties: {}
        summary:
          $ref: '#/components/schemas/WorkspaceSummary'
        franchises:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFranchise'
        cancellations:
          type: integer
      required:
      - metrics
    EarningsFranchise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        share_percent:
          type: string
        billed:
          type: string
        collected:
          type: string
        earned:
          type: string
        paid:
          type: string
        balance:
          type: string
      required:
      - balance
      - billed
      - collected
      - earned
      - id
      - name
      - paid
      - share_percent
    EarningsResponse:
      type: object
      properties:
        balance:
          type: string
        can_payout:
          type: boolean
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
        franchises:
          type: array
          items:
            $ref: '#/components/schemas/EarningsFranchise'
        summary:
          type: object
          additionalProperties:
            type: string
      required:
      - balance
      - can_payout
      - franchises
      - results
      - summary
    LSGDImportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rows:
          type: array
          items: {}
        committed:
          type: boolean
        count:
          type: integer
      required:
      - committed
      - count
      - id
      - rows
    LSGDImportUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    PricingCell:
      type: object
      properties:
        franchise:
          type: string
          format: uuid
        amount:
          type: string
          nullable: true
        discount_percent:
          type: string
          nullable: true
        final_price:
          type: string
          nullable: true
        override:
          type: boolean
        eligible:
          type: boolean
      required:
      - amount
      - discount_percent
      - eligible
      - final_price
      - franchise
      - override
    PricingFranchise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
      required:
      - id
      - kind
      - name
    PricingProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category_name:
          type: string
        unit:
          type: string
        default:
          type: string
          nullable: true
        tax_percent:
          type: string
        hsn:
          type: string
        default_final_price:
          type: string
          nullable: true
        default_discount_percent:
          type: string
          nullable: true
        cells:
          type: array
          items:
            $ref: '#/components/schemas/PricingCell'
      required:
      - category_name
      - cells
      - default
      - default_discount_percent
      - default_final_price
      - hsn
      - id
      - name
      - tax_percent
      - unit
    PricingResponse:
      type: object
      properties:
        franchises:
          type: array
          items:
            $ref: '#/components/schemas/PricingFranchise'
        results:
          type: array
          items:
            $ref: '#/components/schemas/PricingProduct'
      required:
      - franchises
      - results
    RegisterResponse:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        date_basis:
          type: string
        summary:
          type: object
          additionalProperties: {}
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - date_basis
      - page
      - page_size
      - results
      - summary
    ScreenEnum:
      enum:
      - bills
      - customers
      type: string
      description: |-
        * `bills` - bills
        * `customers` - customers
    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - results
    SearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        screen:
          $ref: '#/components/schemas/ScreenEnum'
        type:
          type: string
        name:
          type: string
        detail:
          type: string
      required:
      - detail
      - id
      - name
      - screen
      - type
    WorkspaceFranchise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        today:
          type: string
        month:
          type: string
        count:
          type: integer
        receivable:
          type: string
        payable:
          type: string
        share_owed:
          type: string
          nullable: true
      required:
      - count
      - id
      - kind
      - month
      - name
      - payable
      - receivable
      - share_owed
      - today
    WorkspaceSummary:
      type: object
      properties:
        today:
          type: string
        month:
          type: string
        incoming_outstanding:
          type: string
        outgoing_outstanding:
          type: string
        share_owed:
          type: string
      required:
      - incoming_outstanding
      - month
      - outgoing_outstanding
      - share_owed
      - today
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
